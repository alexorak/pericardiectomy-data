<title>Pericardiectomy Intraop Record</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef2f7; --panel:#ffffff; --chrome:#dce6f1; --line:#b9c8da;
  --ink:#1a1a1a; --ink-2:#4a5560; --ink-3:#6f7b87; --accent:#1f4e79; --bad:#a3282a;
  --sans:"Segoe UI",Tahoma,Geneva,Verdana,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  display:grid;place-items:center;padding:24px}
.gate{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;overflow:hidden}
.gate header{background:var(--chrome);border-bottom:1px solid var(--line);padding:11px 16px}
.gate h1{margin:0;font-size:15px;font-weight:600;color:var(--accent)}
.gate .sub{margin:3px 0 0;font-size:11.5px;color:var(--ink-2)}
.body{padding:16px}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);margin-bottom:5px}
input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:3px;font:inherit;
  font-size:14px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{margin-top:10px;width:100%;padding:8px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;border-radius:3px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#1a4165}
button[disabled]{opacity:.6;cursor:progress}
.msg{margin-top:9px;font-size:12px;min-height:16px;color:var(--bad)}
.note{margin-top:13px;padding-top:11px;border-top:1px solid #dfe6ef;font-size:11px;color:var(--ink-3);
  line-height:1.5}
</style>
</head>

<script>
const ITER=310000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById("f"), pw=document.getElementById("pw"),
      msg=document.getElementById("msg"), go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();
  msg.textContent=""; go.disabled=true; go.textContent="Decrypting\u2026";
  try{
    const raw=b64(document.getElementById("payload").textContent.trim());
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),
      {name:"PBKDF2"},false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits(
      {name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,256);
    const key=await crypto.subtle.importKey("raw",bits,{name:"AES-GCM"},false,["decrypt"]);
    const out=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
    const html=new TextDecoder().decode(out);
    document.open(); document.write(html); document.close();
  }catch(err){
    go.disabled=false; go.textContent="Open record";
    msg.textContent="That passphrase does not open this record.";
    pw.select();
  }
});
</script>
